name: gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: tsc (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: tsc (spec)
        run: npx tsc --noEmit -p tsconfig.spec.json

      - name: lint (0 errors)
        run: npm run lint

      - name: lint:px-styles (must not rise)
        run: npm run lint:px-styles

      - name: test
        # --isolate: the unit-test builder defaults to isolate=false, so each vitest worker keeps
        # every spec file's module graph and, past 300 spec files, outgrew the small CI runner
        # (a worker OOM, then a runner shutdown — never a failing test). Isolated, the suite peaks
        # at ~3.75 GB instead of ~6.5 GB, at ~2.5x the test time. Local `npm test` is unchanged.
        run: npm test -- --watch=false --isolate

      - name: TODO audit (printed, not gated)
        run: grep -rn "TODO(0" src/ || true
