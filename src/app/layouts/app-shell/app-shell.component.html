<div
  class="min-h-screen h-screen bg-bg text-text-primary font-sans flex"
  [attr.dir]="locale.direction()"
>
  <app-sidebar class="hidden lg:block h-full shrink-0" />

  @if (mobileDrawerOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/40 lg:hidden"
      (click)="closeMobileDrawer()"
      aria-hidden="true"
    ></div>
    <app-sidebar
      class="fixed inset-y-0 start-0 z-50 lg:hidden h-full shadow-lg"
      [expanded]="true"
      (navigate)="closeMobileDrawer()"
    />
  }

  <div class="flex-1 flex flex-col min-w-0 h-full">
    <app-topbar (menuToggle)="toggleMobileDrawer()" />
    <main class="flex-1 overflow-auto">
      <router-outlet />
    </main>
  </div>

  <pera-command-palette />
  <pera-toast-container />
</div>
