<div class="min-h-dvh h-dvh bg-bg text-text-primary font-sans flex" [attr.dir]="locale.direction()">
  <!-- RD-1: the docked dark sidebar — full or icon rail on desktop, rail on tablet, none on phone. -->
  @if (layout.dockedMode(); as mode) {
    @if (mode !== 'none') {
      <app-sidebar
        class="h-full shrink-0"
        [mode]="mode"
        [collapsible]="layout.device() === 'desktop'"
        (toggleCollapse)="layout.toggle()"
      />
    }
  }

  <!-- Tablet and phone: the full sidebar slides over the page. -->
  @if (layout.drawerOpen() && layout.device() !== 'desktop') {
    <div
      class="fixed inset-0 z-40 bg-black/40"
      data-shell-scrim
      (click)="layout.closeDrawer()"
      aria-hidden="true"
    ></div>
    <app-sidebar
      class="fixed inset-y-0 start-0 z-50 h-full shadow-lg"
      role="dialog"
      aria-modal="true"
      aria-label="Menu"
      mode="full"
      [drawer]="true"
      (navigate)="layout.closeDrawer()"
      (closed)="layout.closeDrawer()"
    />
  }

  <div class="flex-1 flex flex-col min-w-0 h-full">
    <app-topbar />
    <main class="flex-1 overflow-auto">
      <router-outlet />
    </main>
    @if (layout.device() === 'phone') {
      <app-bottom-tabs class="shrink-0" [moreOpen]="layout.drawerOpen()" (more)="layout.toggle()" />
    }
  </div>

  <pera-command-palette />
  <pera-toast-container />
</div>
